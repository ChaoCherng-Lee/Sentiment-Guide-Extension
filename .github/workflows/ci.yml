# Plan 12.1: checks on every push and pull request.
#   - checks: type-check, unit + database tests, the function copy, both editions
#   - e2e: the end-to-end tests with the stand-in model (no Ollama needed)
#   - eval: scores the real prompts with the cloud check, only when prompts or
#     backends change and the repository has the CLOUD secrets (see below)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      # Unit tests and the database rules (PGlite, in process)
      - run: npm test
      # The consumer build has no parent sharing code; the family build has it (Plan 11.1)
      - run: npm run check:editions

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx wxt build --mode e2e
      # "app" only: the "real-model" project needs Ollama on the machine
      - run: npx playwright test --project=app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  eval:
    # Repository secrets CLOUD_URL and CLOUD_ANON_KEY: the deployed tone-check
    # function and the project's anon key. Without them this job is skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SG_CLOUD_URL: ${{ secrets.CLOUD_URL }}
      SG_CLOUD_ANON_KEY: ${{ secrets.CLOUD_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did prompts or backends change?
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$SG_CLOUD_URL" ] || [ -z "$SG_CLOUD_ANON_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No CLOUD secrets: skipping the eval"; exit 0
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(src/analysis/|supabase/functions/|eval/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Prompts and backends unchanged: skipping the eval"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        run: npm run eval -- --backend cloud --compare
      - if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/results/
          retention-days: 30
