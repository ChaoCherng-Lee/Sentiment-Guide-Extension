<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sentiment Guide</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 300px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.5;
        background: #f7f7fb;
        color: #111827;
      }

      h1 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 3px;
      }

      .subtitle {
        font-size: 11px;
        color: #6b7280;
        margin-bottom: 14px;
      }

      .section {
        background: white;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
        box-shadow: 0 1px 3px rgba(15,23,42,0.06);
      }

      .section-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #6b7280;
        margin-bottom: 8px;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #d1d5db;
      }
      .status-dot.green { background: #10b981; }
      .status-dot.red   { background: #ef4444; }

      .status-text {
        font-size: 13px;
        font-weight: 500;
        color: #111827;
      }

      .status-cmd {
        margin-top: 8px;
        font-size: 11px;
        color: #6b7280;
        background: #f3f4f6;
        border-radius: 6px;
        padding: 5px 8px;
        font-family: monospace;
        display: none;
      }

      .note {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 12px;
        line-height: 1.6;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>◆ Sentiment Guide</h1>
    <p class="subtitle">Tone analysis for kinder texting on WhatsApp Web</p>

    <div class="section">
      <div class="section-title">Local AI Status</div>
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Checking…</span>
      </div>
      <div class="status-cmd" id="statusCmd">ollama serve</div>
    </div>

    <p class="note">Powered by Ollama running locally on your computer.<br>No data leaves your device. No API key needed.</p>

    <script src="popup.js"></script>
  </body>
</html>
